<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Trois niveaux de développement piloté par les spécifications</title>
  <desc id="desc">Les pictogrammes montrent qui intervient sur les specs et le code. En spec-first, la spec est abandonnée après livraison ; en spec-as-source, l’agent génère le code sans édition humaine directe.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="generated-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#047857"/>
    </marker>
    <g id="spec-icon">
      <path d="M12 2 H88 V66 H12 Z" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M6 8 H82 V72 H6 Z" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M0 14 H76 V78 H0 Z" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
      <path d="M58 14 V32 H76" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
      <path d="M14 44 H60 M14 54 H60" stroke="#8b5cf6" stroke-width="3"/>
    </g>
    <g id="code-icon">
      <rect x="10" y="2" width="82" height="66" rx="4" fill="#0f3f53" stroke="#0f172a" stroke-width="2"/>
      <rect x="4" y="8" width="82" height="66" rx="4" fill="#164e63" stroke="#0f172a" stroke-width="2"/>
      <rect y="14" width="82" height="66" rx="4" fill="#164e63" stroke="#0f172a" stroke-width="2"/>
      <path d="M25 35 L17 47 L25 59 M57 35 L65 47 L57 59 M48 32 L36 62" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="human-icon">
      <circle cx="14" cy="8" r="7" fill="#0f766e"/>
      <path d="M3 36 V29 C3 20 8 16 14 16 C20 16 25 20 25 29 V36 Z" fill="#0f766e"/>
    </g>
    <g id="agent-icon">
      <path d="M14 2 V8 M10 2 H18" stroke="#0369a1" stroke-width="2"/>
      <rect x="2" y="8" width="24" height="22" rx="5" fill="#0ea5e9" stroke="#075985" stroke-width="2"/>
      <circle cx="9" cy="18" r="2" fill="#ffffff"/>
      <circle cx="19" cy="18" r="2" fill="#ffffff"/>
      <path d="M9 25 H19 M5 32 V37 M23 32 V37" stroke="#075985" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="trash-icon">
      <path d="M8 13 H42 L39 52 H11 Z" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
      <path d="M5 10 H45 M17 6 H33 M18 21 V43 M31 21 V43" fill="none" stroke="#b91c1c" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="pencil-icon">
      <path d="M3 23 L20 6 L28 14 L11 31 L2 33 Z" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
      <path d="M17 9 L25 17 M2 33 L8 31" stroke="#a16207" stroke-width="2"/>
    </g>
  </defs>
  <rect x="14" y="14" width="1372" height="892" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="700" y="52" text-anchor="middle" font-size="26" font-weight="700">Trois niveaux de spec-driven development</text>

    <rect x="30" y="72" width="1340" height="48" rx="8" fill="#475569"/>
    <text x="120" y="103" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Approche</text>
    <text x="480" y="103" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Création</text>
    <text x="1055" y="103" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">Évolution et maintenance</text>

    <rect x="30" y="130" width="1340" height="220" fill="#f8fafc"/>
    <text x="120" y="220" text-anchor="middle" font-size="21" font-weight="700">Spec-first</text>
    <use href="#spec-icon" x="275" y="165"/>
    <path d="M390 205 H500" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <use href="#code-icon" x="525" y="165"/>
    <use href="#human-icon" x="312" y="260"/>
    <use href="#agent-icon" x="342" y="260"/>
    <use href="#human-icon" x="562" y="260"/>
    <use href="#agent-icon" x="592" y="260"/>

    <use href="#spec-icon" x="760" y="165"/>
    <path d="M775 177 L843 244 M843 177 L775 244" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    <use href="#trash-icon" x="865" y="177"/>
    <path d="M925 205 H975" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <use href="#spec-icon" x="990" y="165"/>
    <path d="M1105 205 H1140" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <use href="#code-icon" x="1165" y="165"/>
    <use href="#human-icon" x="1022" y="260"/>
    <use href="#agent-icon" x="1052" y="260"/>
    <use href="#human-icon" x="1202" y="260"/>
    <use href="#agent-icon" x="1232" y="260"/>

    <path d="M30 360 H1370" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="30" y="370" width="1340" height="220" fill="#ffffff"/>
    <text x="120" y="460" text-anchor="middle" font-size="20" font-weight="700">Spec-anchored</text>
    <use href="#spec-icon" x="275" y="405"/>
    <path d="M390 445 H500" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <use href="#code-icon" x="525" y="405"/>
    <use href="#human-icon" x="312" y="500"/>
    <use href="#agent-icon" x="342" y="500"/>
    <use href="#human-icon" x="562" y="500"/>
    <use href="#agent-icon" x="592" y="500"/>

    <use href="#spec-icon" x="820" y="405"/>
    <use href="#pencil-icon" x="883" y="395"/>
    <path d="M935 445 H1090" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <use href="#code-icon" x="1115" y="405"/>
    <use href="#human-icon" x="842" y="500"/>
    <use href="#agent-icon" x="872" y="500"/>
    <use href="#human-icon" x="1152" y="500"/>
    <use href="#agent-icon" x="1182" y="500"/>

    <path d="M30 600 H1370" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 7"/>
    <rect x="30" y="610" width="1340" height="220" fill="#f8fafc"/>
    <text x="120" y="700" text-anchor="middle" font-size="20" font-weight="700">Spec-as-source</text>
    <use href="#spec-icon" x="275" y="645"/>
    <path d="M390 685 H500" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#generated-arrow)"/>
    <use href="#code-icon" x="525" y="645"/>
    <use href="#human-icon" x="312" y="740"/>
    <use href="#agent-icon" x="342" y="740"/>
    <use href="#agent-icon" x="592" y="740"/>
    <use href="#human-icon" x="562" y="740"/>
    <path d="M559 752 L590 783 M590 752 L559 783" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

    <use href="#spec-icon" x="820" y="645"/>
    <use href="#pencil-icon" x="883" y="635"/>
    <path d="M935 685 H1090" fill="none" stroke="#047857" stroke-width="3" marker-end="url(#generated-arrow)"/>
    <use href="#code-icon" x="1115" y="645"/>
    <use href="#human-icon" x="842" y="740"/>
    <use href="#agent-icon" x="872" y="740"/>
    <use href="#agent-icon" x="1182" y="740"/>
    <use href="#human-icon" x="1152" y="740"/>
    <path d="M1149 752 L1180 783 M1180 752 L1149 783" stroke="#dc2626" stroke-width="4" stroke-linecap="round"/>

    <path d="M30 840 H1370" stroke="#cbd5e1" stroke-width="2"/>
    <use href="#spec-icon" x="42" y="850" transform="scale(0.5) translate(42 850)"/>
    <text x="94" y="878" font-size="14">Spec</text>
    <use href="#code-icon" x="145" y="850" transform="scale(0.5) translate(145 850)"/>
    <text x="197" y="878" font-size="14">Code</text>
    <use href="#human-icon" x="280" y="855"/>
    <text x="312" y="878" font-size="14">Humain</text>
    <use href="#agent-icon" x="403" y="854"/>
    <text x="436" y="878" font-size="14">Agent IA</text>
    <use href="#trash-icon" x="530" y="850" transform="scale(0.65) translate(285 458)"/>
    <text x="570" y="878" font-size="14">Spec écartée</text>
    <use href="#pencil-icon" x="705" y="850"/>
    <text x="741" y="878" font-size="14">Spec modifiée</text>
    <use href="#human-icon" x="900" y="855"/>
    <path d="M897 852 L929 888 M929 852 L897 888" stroke="#dc2626" stroke-width="3"/>
    <text x="940" y="878" font-size="14">Pas d’édition humaine directe du code</text>
  </g>
</svg>
